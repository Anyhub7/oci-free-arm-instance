name: Try to Create OCI VM
# 每 5 分钟抢一次大阪区 A1.Flex（Always Free 额度）。
# 修复记录（2026-10-06）：原脚本 region 全写 ap-singapore-1，但账号 home region
# 是 ap-osaka-1，免费机只能建在 home region；启动卷 200GB 会超 200GB 免费总额，
# 改为 50GB；加了幂等检查（已有 A1 就跳过）；通知只走邮件；失败时打印 OCI 原始
# 报错；2核12G 无容量时自动降级试 1核6G。
on:
  schedule:
    - cron: "*/5 * * * *"
  # Allows you to manually run this workflow from the Actions tab
  workflow_dispatch:
env:
  COMPARTMENT_ID: "ocid1.tenancy.oc1..aaaaaaaapigjvcqqquqdwctgwtoselxortcgoip2fiouzsjmvpdvylwfcica"  # root compartment = tenancy OCID（大阪 home region）
  IMAGE_ID: "ocid1.image.oc1.ap-osaka-1.aaaaaaaa32nht45vu6d4xf3dlqydt2k2zghlds3fzdm5oidnonjgrhuon6fa"              # Canonical Ubuntu 24.04 Minimal aarch64，大阪区专属 OCID
  SUBNET_ID: "ocid1.subnet.oc1.ap-osaka-1.aaaaaaaaizhuffnji7uz5yte37pj7ary72lyc774bhk27mie2qyvsxmu674a"            # vcn-20260621-1905 的公网子网 OCID（大阪）
  AD_NAME: "jwoj:AP-OSAKA-1-AD-1"                # 大阪 AD 确切名称（租户专属，控制台复制）
  OCI_CLI_REGION: "ap-osaka-1"
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY: ${{ secrets.OCI_CLI_KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Cache pip packages
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ~/.local
          key: ${{ runner.os }}-pip-oci-cli-v1

      - name: Add OCI CLI to path
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup OCI CLI config
        run: |
          pip install --quiet oci-cli

          mkdir -p ~/.oci
          printf '%s' "${{ secrets.OCI_CLI_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_CLI_USER }}
          tenancy=${{ secrets.OCI_CLI_TENANCY }}
          fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}
          key_file=$HOME/.oci/oci_api_key.pem
          region=${{ env.OCI_CLI_REGION }}
          EOF
          chmod 600 ~/.oci/config

          printf '%s' "${{ secrets.SSH_PUBLIC_KEY }}" > $HOME/my_ssh_key.pub

      - name: Check existing A1 instances
        id: check
        run: |
          # 幂等保护：已有 running/provisioning/starting 的 A1 就跳过，避免重复创建
          COUNT=$(oci compute instance list --compartment-id "$COMPARTMENT_ID" --all 2>/dev/null \
            | jq '[.data[] | select(.shape=="VM.Standard.A1.Flex" and (."lifecycle-state"=="RUNNING" or ."lifecycle-state"=="PROVISIONING" or ."lifecycle-state"=="STARTING"))] | length')
          echo "count=${COUNT:-0}" >> $GITHUB_OUTPUT
          echo "Existing A1 instances (active): ${COUNT:-0}"

      - name: Try to create A1 VM
        id: create_vm
        if: steps.check.outputs.count == '0'
        # This forces the job to succeed so the cache will save.
        continue-on-error: true
        run: |
          set -o pipefail

          launch() {  # $1 = shape-config JSON
            oci compute instance launch \
              --compartment-id "$COMPARTMENT_ID" \
              --availability-domain "$AD_NAME" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config "$1" \
              --subnet-id "$SUBNET_ID" \
              --image-id "$IMAGE_ID" \
              --ssh-authorized-keys-file "$HOME/my_ssh_key.pub" \
              --assign-public-ip true \
              --display-name "trojan-osaka-a1" \
              --boot-volume-size-in-gbs 50 2>&1 || true
          }

          SHAPE_USED=""
          OCI_OUTPUT=""
          # 先试 2核12G，无容量则降级试 1核6G（trojan 备胎机够用）
          for CFG in '{"ocpus":2,"memoryInGBs":12}' '{"ocpus":1,"memoryInGBs":6}'; do
            echo "Trying shape-config: $CFG"
            OCI_OUTPUT=$(launch "$CFG")
            if echo "$OCI_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
              echo "Success! VM is PROVISIONING with $CFG."
              SHAPE_USED="$CFG"
              break
            fi
            echo "----- attempt raw output -----"
            echo "$OCI_OUTPUT"
            echo "----------------------------"
          done

          # Store the log as a GitHub step output
          echo "log_data<<EOF" >> $GITHUB_OUTPUT
          echo "$OCI_OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "shape_used=$SHAPE_USED" >> $GITHUB_OUTPUT

          if [ -n "$SHAPE_USED" ]; then
            exit 0
          else
            echo "All attempts failed (most likely out of host capacity). Will retry next run."
            exit 1
          fi

      - name: 抢到OCI实例发送邮件通知
        # 关键判断：只有创建成功才运行本步骤
        if: steps.create_vm.outcome == 'success'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_SENDER }}
          password: ${{ secrets.MAIL_PWD }}
          from: ${{ secrets.MAIL_SENDER }}
          to: ${{ secrets.MAIL_RECEIVER }}
          subject: 【成功】A1.Flex ARM主机 - OCI大阪已抢到
          body: |
            GitHub Actions 已在大阪区成功创建 A1.Flex 实例（trojan-osaka-a1，${{ steps.create_vm.outputs.shape_used }}）！
            幂等检查会自动跳过后续创建；也可去仓库 Actions 页面手动 Disable 该 workflow。
            完整OCI返回日志：
            ${{ steps.create_vm.outputs.log_data }}

      - name: 异常失败发邮件通知
        # 非容量问题的失败才发邮件告警；单纯没容量不打扰
        if: steps.create_vm.outcome == 'failure' && !contains(steps.create_vm.outputs.log_data, 'capacity')
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_SENDER }}
          password: ${{ secrets.MAIL_PWD }}
          from: ${{ secrets.MAIL_SENDER }}
          to: ${{ secrets.MAIL_RECEIVER }}
          subject: 【异常】OCI大阪建机失败（非容量问题，请检查）
          body: |
            GitHub Actions 在大阪区创建 A1.Flex 实例失败，且报错不是容量问题，请检查配置：
            ${{ steps.create_vm.outputs.log_data }}
